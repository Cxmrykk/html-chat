<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="manifest"
      href='data:application/json,{"name":"HTML Chat","display":"standalone","icons":[{"src":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTIwIDJINGMtMS4xIDAtMiAuOS0yIDJ2MThsNC00aDE0YzEuMSAwIDItLjkgMi0yVjRjMC0xLjEtLjktMi0yLTJ6Ii8+PC9zdmc+","sizes":"512x512","type":"image/svg+xml"}]}'
    />

    <title>HTML Chat</title>

    <script>
      /*
       * Pre-paint chrome restore.
       *
       * IndexedDB is async: by the time prefs load the page has already
       * painted, so a dark-mode reload flashes white and the sidebar/header
       * jump. `data/prefs-repo.js` mirrors exactly these three values into
       * localStorage, which is readable synchronously, for this script alone.
       * Key names must stay in step with `data/keys.js`.
       */
      (function () {
        var root = document.documentElement;

        var read = function (key) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            // Storage blocked (private mode): fall back to defaults.
            return null;
          }
        };

        var theme = read('mf_theme');
        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (theme === 'dark' || (!theme && prefersDark)) root.classList.add('dark-theme');
        if (read('mf_sidebar_hidden') === 'true') root.classList.add('sidebar-hidden');
        if (read('mf_title_hidden') === 'true') root.classList.add('title-hidden');
      })();
    </script>

    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <div class="top-actions">
      <a id="toggle-theme-btn" class="top-btn" title="Toggle dark mode (Alt+D)"
         data-command="ui.toggleTheme">[<span class="toggle-word">dark</span>]</a>
      <a id="toggle-title-btn" class="top-btn" title="Toggle title (Alt+O)"
         data-command="ui.toggleTitle">[<span class="toggle-word">title</span>]</a>
      <a id="toggle-sidebar-btn" class="top-btn" title="Toggle sidebar (Alt+P)"
         data-command="ui.toggleSidebar">[<span class="toggle-word">sidebar</span>]</a>
    </div>

    <header id="header">
      <h1>HTML Chat</h1>
      <p>Browser-based chat for OpenAI-compatible APIs.</p>
    </header>

    <div class="grid">
      <aside class="sidebar" id="sidebar">
        <div class="config-box">
          <h3 id="settings-heading" data-command="settings.toggle"
              title="Ctrl+Click for Super Secret Settings">Settings</h3>
          <label for="cfg-url">Base URL</label>
          <input type="text" id="cfg-url" placeholder="https://api.openai.com/v1" />
          <label for="cfg-key">API Key</label>
          <input type="password" id="cfg-key" placeholder="sk-..." />
          <label for="cfg-models">Models (use commas)</label>
          <input type="text" id="cfg-models" placeholder="gpt-4o,gpt-3.5-turbo" />
          <label class="checkbox-label">
            <input type="checkbox" id="cfg-godmode" />
            <strong>Execute JavaScript</strong>
          </label>
          <button data-command="settings.saveConnection">Save</button>
          <button data-command="chat.import">Import</button>
          <button data-command="chat.export">Export</button>
        </div>

        <div class="sidebar-section">
          <div class="section-header">
            <h3>Your Chats</h3>
            <button data-command="chat.new" title="New: Alt+T · Import: Alt+Click">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              New
            </button>
          </div>
          <div id="chat-list"></div>
        </div>

        <div class="sidebar-section">
          <div class="section-header">
            <h3>Your Files</h3>
            <button data-command="file.upload" title="Upload Files for Vector Search">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              Upload
            </button>
          </div>
          <div id="file-list"></div>
        </div>
      </aside>

      <main class="main">
        <div id="chat-container"></div>

        <div id="input-area">
          <!-- Composer: prompt entry and message editing. -->
          <div id="composer-bar">
            <div class="button-row">
              <select id="model-select" data-command="settings.setModel"></select>
              <button id="send-btn" data-command="chat.send" title="Ctrl+Enter / Cmd+Enter">Send</button>
              <button id="save-edit-btn" class="hidden" data-command="message.saveEdit"
                      title="Ctrl+Enter / Cmd+Enter">Save</button>
              <button id="cancel-edit-btn" class="hidden" data-command="message.cancelEdit">Cancel</button>
            </div>
            <textarea id="chat-input" placeholder="Type your prompt here..."></textarea>
          </div>

          <!-- Settings editor: its own textarea, so the composer is never repurposed. -->
          <div id="settings-bar" class="hidden">
            <div class="button-row">
              <button id="settings-save-btn" data-command="settings.save"
                      title="Ctrl+Enter / Cmd+Enter">Save</button>
              <button id="settings-reset-btn" data-command="settings.reset">Reset</button>
              <button id="settings-cancel-btn" data-command="settings.cancel">Cancel</button>
              <button id="settings-close-btn" data-command="settings.close">Close</button>
            </div>
            <textarea id="settings-input" placeholder="Select a setting above to edit..."></textarea>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./scripts/app/main.js"></script>
  </body>
</html>
