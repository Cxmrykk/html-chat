<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="manifest"
      href='data:application/json,{"name":"HTML Chat","display":"standalone","icons":[{"src":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTIwIDJINGMtMS4xIDAtMiAuOS0yIDJ2MThsNC00aDE0YzEuMSAwIDItLjkgMi0yLTJ6Ii8+PC9zdmc+","sizes":"512x512","type":"image/svg+xml"}]}'
    />

    <title>HTML Chat</title>

    <script>
      /*
       * Pre-paint chrome restore.
       *
       * IndexedDB is async: by the time prefs load the page has already
       * painted, so a dark-mode reload flashes white and the sidebar/header
       * jump. `data/prefs-repo.js` mirrors exactly these three values into
       * localStorage, which is readable synchronously, for this script alone.
       * Key names must stay in step with `data/keys.js`.
       */
      (function () {
        var root = document.documentElement;

        var read = function (key) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            // Storage blocked (private mode): fall back to defaults.
            return null;
          }
        };

        var theme = read('mf_theme');
        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (theme === 'dark' || (!theme && prefersDark)) root.classList.add('dark-theme');
        if (read('mf_sidebar_hidden') === 'true') root.classList.add('sidebar-hidden');
        if (read('mf_title_hidden') === 'true') root.classList.add('title-hidden');
      })();
    </script>

    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <div class="top-actions">
      <a id="toggle-theme-btn" class="top-btn" title="Toggle dark mode (Alt+D)"
         data-command="ui.toggleTheme">[<span class="toggle-word">light</span>]</a>
      <a id="toggle-title-btn" class="top-btn" title="Toggle title (Alt+O)"
         data-command="ui.toggleTitle">[<span class="toggle-word">title</span>]</a>
      <a id="toggle-sidebar-btn" class="top-btn" title="Toggle sidebar (Alt+P)"
         data-command="ui.toggleSidebar">[<span class="toggle-word">sidebar</span>]</a>
    </div>

    <header id="header">
      <h1>HTML Chat</h1>
      <p>Browser-based chat for OpenAI-compatible APIs.</p>
    </header>

    <div class="grid">
      <aside class="sidebar" id="sidebar">
        <div class="config-box">
          <h3 id="settings-heading" data-command="settings.toggle"
              title="Click for Super Secret Settings (Alt+I)">Settings</h3>
          <label for="cfg-url">Base URL</label>
          <input type="text" id="cfg-url" placeholder="https://api.openai.com/v1" data-command="settings.saveConnection" />
          <label for="cfg-key">API Key</label>
          <input type="password" id="cfg-key" placeholder="sk-..." data-command="settings.saveConnection" />
          <label class="checkbox-label"
                 title="Offer the model a tool that runs JavaScript in this page">
            <input type="checkbox" id="cfg-js-exec" data-command="settings.saveConnection" />
            <strong>Code Execution</strong>
          </label>
          <!-- Shown only once an image model is identified (ui/components/connection-form.js). -->
          <label id="cfg-image-gen-label" class="checkbox-label hidden"
                 title="Offer the model tools that generate and edit images, with the image models allowed under Toggle Image Models in the settings">
            <input type="checkbox" id="cfg-image-gen" data-command="settings.saveConnection" />
            <strong>Image Manipulation</strong>
          </label>
        </div>

        <!-- Fills the rest of the sidebar; the list inside scrolls on its own. -->
        <div class="sidebar-section chats-section">
          <div class="section-header">
            <h3>Your Chats</h3>
            <button data-command="chat.new" title="New: Alt+T · Import: Alt+Click">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              New
            </button>
          </div>
          <div id="chat-list"></div>
        </div>
      </aside>

      <main class="main">
        <!--
          The framed chat panel. The transcript scrolls inside it; images
          pasted or dropped, waiting to go out with the next message, sit in
          a strip at its bottom edge, still inside the frame.
        -->
        <div class="chat-frame">
          <div id="chat-container"></div>
          <div id="composer-attachments" class="composer-attachments hidden"></div>
        </div>

        <div id="input-area">
          <!-- Composer: prompt entry and message editing. -->
          <div id="composer-bar">
            <div class="button-row">
              <select id="model-select" data-command="settings.setModel" title="Ctrl+Click to configure thinking levels"></select>
              <!-- The label scrolls when it does not fit (ui/marquee.js). -->
              <button id="send-btn" data-command="chat.send" title="Ctrl+Enter / Cmd+Enter"><span class="marquee-label">Send</span></button>

              <!-- Message edit buttons -->
              <button id="save-edit-btn" class="hidden" data-command="message.saveEdit"
                      title="Ctrl+Enter / Cmd+Enter">Save</button>
              <button id="cancel-edit-btn" class="hidden" data-command="message.cancelEdit">Cancel</button>

              <!-- Thinking edit buttons -->
              <button id="save-thinking-btn" class="hidden" data-command="thinking.save"
                      title="Save thinking levels (Ctrl+Enter / Cmd+Enter)">Save</button>
              <button id="cancel-thinking-btn" class="hidden" data-command="thinking.cancel">Cancel</button>
            </div>
            <textarea id="chat-input" placeholder="Type your prompt here..."></textarea>
            <textarea id="thinking-input" class="hidden" placeholder="none&#10;low&#10;medium&#10;high"></textarea>
          </div>

          <!-- Settings editor: its own textarea, so the composer is never repurposed. -->
          <div id="settings-bar" class="hidden">
            <div class="button-row">
              <button id="settings-save-btn" data-command="settings.save"
                      title="Ctrl+Enter / Cmd+Enter">Save</button>
              <button id="settings-reset-btn" data-command="settings.reset">Reset</button>
              <button id="settings-cancel-btn" data-command="settings.cancel">Cancel</button>
              <!-- Disabled while a setting is being edited (ui/components/input-area.js). -->
              <button id="settings-close-btn" data-command="settings.close"
                      title="Close the settings">Close</button>
            </div>
            <textarea id="settings-input" placeholder="Select a setting above to edit..."></textarea>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./scripts/app/main.js"></script>
  </body>
</html>
